services:
  postgres:
    image: postgres:16-alpine
    container_name: pandamind-postgres
    environment:
      POSTGRES_USER: pandamind
      POSTGRES_PASSWORD: pandamind
      POSTGRES_DB: pandamind
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pandamind -d pandamind"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
