services:
  postgres:
    image: postgres:16-alpine
    container_name: pandamind-db
    environment:
      POSTGRES_USER: pandamind
      POSTGRES_PASSWORD: pandamind
      POSTGRES_DB: pandamind
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pandamind -d pandamind"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./apps/server
    container_name: pandamind-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pandamind:pandamind@postgres:5432/pandamind
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?AUTH_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      HOST: "0.0.0.0"
      PORT: "8000"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build: ./apps/web
    container_name: pandamind-web
    depends_on:
      - server
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  postgres-data:
